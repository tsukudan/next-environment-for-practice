server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Next.js static export のルーティング
    # $uri        → そのままのファイルを探す（例: /favicon.ico）
    # $uri.html   → .html を付けて探す（例: /about → /about.html）
    # $uri/       → ディレクトリの index.html を探す
    # /index.html → 上記すべてで見つからなければ SPA のルートへフォールバック
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # _next/static/ 配下のJS・CSSは本番と同じく長期キャッシュ
    # location ルールはより具体的なものが適用されるため、_next/static/ 配下のルールは / よりも優先される
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
